name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk crackin-showroom-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crackin-showroom-tv-apk
          path: crackin-showroom-tv.apk
      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest crackin-showroom-tv.apk --title "Crackin Showroom TV" --notes "Latest build" --target "$GITHUB_SHA"
